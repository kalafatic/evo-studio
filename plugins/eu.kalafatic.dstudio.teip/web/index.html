<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVO-Studio — Inference</title>
<link rel="stylesheet" href="shared/shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- A. APPLICATION HEADER -->
<header id="app-header">
  <div class="header-left">
    <button id="btn-sidebar" class="icon-btn" title="Toggle navigation (Ctrl+B)">☰</button>
    <span class="brand-mark">&#9672;</span>
    <span class="brand-name">EVO-Studio</span>
  </div>
  <div class="header-center">
    <div class="header-field" title="Current project / workspace">
      <span class="header-field-label">Project</span>
      <span id="top-project" class="header-field-value">no project</span>
    </div>
    <div class="header-select">
      <span class="header-field-label">Provider</span>
      <select id="providerSelect" title="Inference provider"><option value="">loading…</option></select>
    </div>
    <div class="header-select">
      <span class="header-field-label">Model</span>
      <select id="modelSelect" title="Model"><option value="">loading…</option></select>
    </div>
    <button id="refreshBtn" class="icon-btn" title="Reload providers and models">↻</button>
  </div>
  <div class="header-right">
    <span id="context-usage" class="context-usage" title="Context window usage (when reported by the model)">∅ ctx</span>
    <span id="connection-status" class="conn conn-disconnected" title="Backend connection">&#9679; offline</span>
    <button id="btn-conn" class="icon-btn" title="Connection diagnostics">ⓘ</button>
    <button id="btn-auth" class="icon-btn" title="Set server bearer token">🔑</button>
    <button id="btn-theme" class="icon-btn" title="Toggle light/dark theme">◐</button>
    <a id="btn-settings" class="icon-btn" href="settings.html" title="Providers, models, projects, harnesses">⚙</a>
    <a id="btn-help" class="icon-btn" href="help.html" target="_blank" rel="noopener" title="Help and documentation">?</a>
    <button id="btn-more" class="icon-btn" title="More actions">⋮</button>
    <span id="frontend-build" class="build-badge" title="Frontend revision">web r6</span>
    <div id="more-menu" class="menu" hidden>
      <button data-action="new-session">New Session</button>
      <button data-action="export-console">Export Console</button>
      <button data-action="clear-console">Clear Console</button>
    </div>
  </div>
</header>

<div id="app-body">

  <!-- B. LEFT NAVIGATION / SESSION EXPLORER -->
  <aside id="left-sidebar">
    <button id="new-session-btn" class="btn btn-primary btn-block" title="Start a new session (Ctrl+N)">+ New Session</button>
    <input id="session-search" type="search" class="list-search" placeholder="Search sessions…">
    <nav id="left-nav">
      <div class="nav-group-label">Workspace</div>
      <div class="nav-group">
        <button class="nav-btn active" data-view="inference">Inference</button>
        <button class="nav-btn" data-view="sessions">Sessions</button>
        <button class="nav-btn" data-view="tasks">Tasks</button>
      </div>
      <div class="nav-group-label">Manage</div>
      <div class="nav-group">
        <button class="nav-btn" data-view="engines">Engines</button>
        <button class="nav-btn" data-view="models">Models</button>
        <button class="nav-btn" data-view="harnesses">Harnesses</button>
      </div>
    </nav>
    <div id="left-content" class="sidebar-content"></div>
  </aside>

  <!-- C. MAIN WORKSPACE -->
  <main id="main-workspace">
    <div id="workspace-row">
      <section id="conversation-panel" class="workspace-panel">
        <div id="chatLog" class="chat"></div>
      </section>

      <!-- Optional: Diff / Changes panel (hidden when no changes) -->
      <aside id="changes-panel" class="workspace-panel" hidden>
        <div class="panel-head">
          <span class="panel-head-title">Changes</span>
          <button id="changes-close" class="icon-btn" title="Hide changes panel">&#10005;</button>
        </div>
        <div id="changes-content" class="panel-scroll"></div>
      </aside>
    </div>

    <!-- D. BOTTOM COMPOSER -->
    <section id="composer" class="evo-composer">
      <div id="attachments" class="attachments" hidden></div>
      <div class="composer-box evo-composer-box">
        <textarea id="promptInput" rows="2"
          placeholder="Ask the model… (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="composer-bar evo-composer-bar">
          <div class="composer-actions evo-composer-actions">
            <button id="attach-btn" class="icon-btn" title="Attach a project file">📎</button>
            <input id="file-input" type="file" multiple hidden>
            <select id="context-select" class="context-select" title="Attach context from the active project">
              <option value="">no project context</option>
            </select>
          </div>
          <div class="composer-right evo-composer-right">
            <span id="sendStatus" class="muted"></span>
            <button id="cancelBtn" class="btn btn-danger" hidden>Stop</button>
            <button id="sendBtn" class="btn btn-primary">Send</button>
          </div>
        </div>
        <div class="composer-hint evo-composer-hint">Enter to send · Shift+Enter for new line · Ctrl+K to focus</div>
      </div>
    </section>
  </main>

  <!-- OPTIONAL CONTEXTUAL INSPECTOR -->
  <aside id="inspector">
    <div id="inspector-tabs" class="inspector-tabs">
      <button class="insp-tab active" data-tab="context">Context</button>
      <button class="insp-tab" data-tab="files">Files</button>
      <button class="insp-tab" data-tab="activity">Activity</button>
      <button class="insp-tab" data-tab="details">Details</button>
      <button id="btn-inspector" class="icon-btn" title="Hide inspector (Ctrl+.)">»</button>
    </div>
    <div id="inspector-content" class="panel-scroll">
      <div id="right-content">
        <div class="empty-note">Select a session, project, engine, model or harness for details.</div>
      </div>
      <div id="activity-log" hidden></div>
      <div id="details-content" hidden></div>
    </div>
  </aside>
</div>

<!-- Console / Events / Problems -->
<footer id="bottom-panel">
  <div class="bottom-tabs">
    <button class="bottom-tab active" data-panel="console">Console</button>
    <button class="bottom-tab" data-panel="events">Events</button>
    <button class="bottom-tab" data-panel="problems">Problems</button>
    <span class="spacer"></span>
    <div id="console-controls" class="console-controls">
      <button class="console-chip active" id="chip-autoscroll">Auto-scroll</button>
      <button class="console-chip" id="chip-clear">Clear</button>
      <button class="console-chip" id="chip-copy">Copy</button>
      <button class="console-chip" id="chip-export">Export</button>
    </div>
  </div>
  <div id="bottom-content">
    <div id="panel-console" class="bottom-pane active"></div>
    <div id="panel-events" class="bottom-pane"></div>
    <div id="panel-problems" class="bottom-pane"></div>
  </div>
</footer>

<div id="statusbar">
  <span id="sb-engine" class="sb-item">engine —</span>
  <span id="sb-model" class="sb-item">model —</span>
  <span class="spacer"></span>
  <span id="sb-status" class="sb-item">offline</span>
</div>

<div id="toast" class="toast" hidden></div>
<div id="context-menu" class="menu" hidden></div>

<script src="common.js"></script>
<script src="tasks.js"></script>
<script src="app.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/shell-init.js"></script>
</body>
</html>
